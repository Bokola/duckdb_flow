[tool.poetry]
name = "duckdb-flow"
version = "0.1.0"
description = "A data ingestion workflow with duckdb, pydantic, google cloud"
authors = ["Basil Okola <okolabasilowiti@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
duckdb = "^1.3.2"
google-cloud-bigquery = "^3.35.1"
google-auth = "^2.40.3"
google-cloud-bigquery-storage = "^2.32.0"
pyarrow = "^21.0.0"
pandas = "^2.3.1"
fire = "^0.7.0"
loguru = "^0.7.3"
pydantic = "^2.11.7"
pytest = "^8.4.1"
ruff = "^0.12.7"
db-dtypes = "^1.4.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
